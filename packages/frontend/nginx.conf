server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Diese Dateien muessen bei jedem Aufruf neu geprueft werden, sonst erkennt der Browser eine
    # neue Version nicht (Update-Hinweis in der App). Die gehashten Dateien unter /assets/ duerfen
    # dagegen normal gecacht werden.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Sicherungs-Upload (Umzug): gross, aber nur fuer diese eine Adresse; der Server prueft zusaetzlich sein
    # eigenes Limit (2 GB) und dass nur Admins hochladen duerfen. Ohne Zwischenspeichern durchreichen.
    location = /api/settings/backups/upload {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        # Spulen-Fotos (max. 5 MB, siehe Backend) - nginx-Standard waere nur 1 MB.
        client_max_body_size 6m;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
