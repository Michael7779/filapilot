packages:
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/parser@8.70.1'
  - '@typescript-eslint/visitor-keys@8.70.1'
overrides:
  # exceljs 4.4.0 haengt noch an uuid 8 (GHSA-w5hq-g745-h8pq, behoben ab 11.1.1); die genutzte v4-API ist unveraendert.
  uuid: ^11.1.1
